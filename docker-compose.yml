services:
  reverse-proxy:
    image: nginx:stable-alpine
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - prometheus
      - grafana
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.route-prefix=/prometheus", "--web.external-url=/prometheus"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules
    ports:
      - 9090:9090
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    command: ["--config.file=/etc/alertmanager/config.yml"]
    ports:
      - 9093:9093
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - 3000:3000
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    networks:
      - monitoring

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitorpass
      POSTGRES_DB: monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - monitoring

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://monitor:monitorpass@postgres:5432/monitor
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - 8000:8000
    depends_on:
      - postgres
    networks:
      - monitoring

  frontend:
    build: ./frontend
    ports:
      - 8080:80
    depends_on:
      - backend
    networks:
      - monitoring

  ping_exporter:
    build: ./exporters/ping_exporter
    environment:
      - TARGETS=8.8.8.8,1.1.1.1
    cap_add:
      - NET_RAW
    ports:
      - 9115:9115
    networks:
      - monitoring

  node_exporter:
    image: prom/node-exporter:latest
    ports:
      - 9100:9100
    networks:
      - monitoring

volumes:
  pgdata:
  grafana-storage:

networks:
  monitoring:
    driver: bridge
