version: '3.8'
services:
  influxdb:
    image: influxdb:2.7
    environment:
      - INFLUXDB_UI_AUTH_DISABLED=false
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=adminpass
    ports:
      - '8086:8086'
    volumes:
      - influx-data:/var/lib/influxdb2
  grafana:
    image: grafana/grafana:10.0
    ports:
      - '3000:3000'
    depends_on:
      - influxdb
  collector:
    build: ./collector
    ports:
      - '8000:8000'
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=change-me
      - PROBE_API_KEY=default-probe-key
      - NOTIFICATION_SERVICE_URL=http://node-notifier:4000/alert
    depends_on:
      - influxdb
      - node-notifier
  node-notifier:
    build: ./nodejs/notification
    ports:
      - '4000:4000'
    environment:
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASS=
      - ALERT_EMAILS=
      - TWILIO_SID=
      - TWILIO_TOKEN=
      - TWILIO_FROM=
      - ALERT_SMS_TO=
volumes:
  influx-data:
