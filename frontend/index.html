<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISP Monitor</title>
  </head>
  <body>
    <div id="app">
      <h1>ISP Monitoring - Targets</h1>
      <form id="addForm">
        <input id="name" placeholder="name" />
        <input id="address" placeholder="address (IP or host)" required />
        <button>Add target</button>
      </form>
      <ul id="targets"></ul>
    </div>
    <script>
      const api = '/api/targets'
      async function load(){
        const res = await fetch(api)
        const list = await res.json()
        const ul = document.getElementById('targets')
        ul.innerHTML = ''
        list.forEach(t=>{
          const li = document.createElement('li')
          li.textContent = `${t.id} - ${t.name || '-'} - ${t.address}`
          ul.appendChild(li)
        })
      }
      document.getElementById('addForm').addEventListener('submit', async (e)=>{
        e.preventDefault()
        const name = document.getElementById('name').value
        const address = document.getElementById('address').value
        await fetch(api, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, address})})
        document.getElementById('name').value=''
        document.getElementById('address').value=''
        load()
      })
      load()
    </script>
  </body>
</html>
